name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SkillSpectorScanner-windows.exe
          - os: macos-latest
            asset: SkillSpectorScanner-macos.zip
          - os: ubuntu-latest
            asset: SkillSpectorScanner-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name SkillSpectorScanner skillspector_gui.py
          mv dist/SkillSpectorScanner.exe dist/${{ matrix.asset }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./build_macos.sh
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
